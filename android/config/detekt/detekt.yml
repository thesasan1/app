# Overrides on top of detekt's default rule set (buildUponDefaultConfig = true). ADR-016.
config:
  validation: true

naming:
  MatchingDeclarationName:
    # Feature navigation files (FooNavigation.kt) hold a route object plus its NavGraphBuilder extension.
    active: false
  FunctionNaming:
    # Composable functions are PascalCase; backticked test names are allowed.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    # Composables take many optional parameters by convention.
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Repository interfaces, their implementations and Room DAOs are wide by nature: one function
    # per operation. Their fakes in tests follow them.
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 20
    excludes: ['**/test/**']

style:
  MagicNumber:
    # Design tokens, previews and tests are made of literal values.
    ignoreAnnotated: ['Preview']
    excludes: ['**/test/**', '**/designsystem/theme/**', '**/designsystem/component/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
