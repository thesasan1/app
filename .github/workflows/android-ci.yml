name: android-ci

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROBOLECTRIC_JAR: android-all-instrumented-14-robolectric-10818077-i7
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Robolectric's Android runtime (~180 MB) is cached and fetched with retries; tests then run
      # offline (KI-010). Update ROBOLECTRIC_JAR when Robolectric or the test SDK (34) changes.
      - name: Cache Robolectric runtime
        uses: actions/cache@v4
        with:
          path: ~/robolectric-deps
          key: robolectric-${{ env.ROBOLECTRIC_JAR }}

      - name: Fetch Robolectric runtime
        run: |
          mkdir -p ~/robolectric-deps
          if [ ! -s ~/robolectric-deps/$ROBOLECTRIC_JAR.jar ]; then
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              -o ~/robolectric-deps/$ROBOLECTRIC_JAR.jar \
              https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/${ROBOLECTRIC_JAR#android-all-instrumented-}/$ROBOLECTRIC_JAR.jar
          fi
          echo "ROBOLECTRIC_DEPS_DIR=$HOME/robolectric-deps" >> "$GITHUB_ENV"

      - name: Formatting and static analysis
        run: ./gradlew spotlessCheck detekt --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:common:test --stacktrace

      - name: Record design-system screenshots
        run: ./gradlew :core:designsystem:recordRoborazziDebug --stacktrace

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: designsystem-screenshots
          path: android/core/designsystem/build/outputs/roborazzi/*.png
          if-no-files-found: error

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: android/core/database/schemas/
          if-no-files-found: ignore

      - name: Room schemas are committed
        # The build exports each schema version to core/database/schemas (ADR-017). A difference
        # means the entities changed without bumping the version or committing the new schema.
        run: |
          if [ -n "$(git status --porcelain -- core/database/schemas)" ]; then
            git status --porcelain -- core/database/schemas
            git diff -- core/database/schemas
            echo "::error::Room schema changed. Commit core/database/schemas (bump the version for released schemas)."
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/**/build/reports/**
            android/**/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
