name: dependency-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          # Fail on known vulnerabilities of moderate severity or worse (docs/SECURITY.md, "Dependencies").
          fail-on-severity: moderate
          # Licenses incompatible with distributing a closed-source app.
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-or-later
          comment-summary-in-pr: on-failure
