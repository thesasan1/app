# Weekly update PRs (docs/SECURITY.md, "Dependencies"). Each update still needs green CI before merge.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      lint-and-test:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier", "jest", "ts-jest", "@types/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
